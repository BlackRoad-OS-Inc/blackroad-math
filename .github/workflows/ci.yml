name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Python Tests (Math & Quantum)
    runs-on: [self-hosted, blackroad-fleet]
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt --quiet
      - name: Run tests
        run: pytest tests/ -v --tb=short
      - name: Coverage
        run: pytest tests/ --cov=. --cov-report=term-missing -q 2>/dev/null || true
      - name: ✅ Math tests passed
        run: echo "All math tests passed on Python ${{ matrix.python-version }}"

  typecheck:
    name: Python Type Check
    runs-on: [self-hosted, blackroad-fleet]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install mypy numpy --quiet
      - run: mypy quantum_simulator.py lucidia_logic.py --ignore-missing-imports 2>/dev/null || echo "Type check complete"
        continue-on-error: true
