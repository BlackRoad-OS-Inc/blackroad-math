name: Auto-merge
# ✅ Verified Working — enables squash-merge on PRs once all required status checks pass.
# Requires "Allow auto-merge" to be enabled in the repository settings.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  automerge:
    name: Enable auto-merge
    runs-on: ubuntu-latest
    if: github.actor == 'github-actions[bot]' || github.actor == 'copilot[bot]' || github.actor == 'dependabot[bot]'
    permissions:
      pull-requests: write
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Enable auto-merge
        uses: peter-evans/enable-pull-request-automerge@a660677d5469627102a1c1e11409dd063606628d # v3.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          pull-request-number: ${{ github.event.pull_request.number }}
          merge-method: squash
